<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
     
<header>
    
    <h1>MEAL FINDER</h1>
    <i class="fa-solid fa-bars" id="menu"></i>
    
    <div id="categoryMenu">
        <i class="fa-regular fa-circle-xmark" id="close" style="color: orangered;"></i>
        <div id="categoryList"></div>
    </div>
</header>
    <section class="bgd-img">
        <img src="img.jpg" width="100%" height="450px" alt="">
        <div class="search">
            <input type="text" placeholder="search recipes" id="searchInput">
            <i class="fa-solid fa-magnifying-glass" id="searchBtn"></i><br><br>
            <h2>What are your favorite Cuisines?</h2><br>
            <p>PERSONALIZE YOUR EXPERIENCE</p>
        </div>
        
    </section>
    <section id="searchMeal">
        <h1>MEALS</h1><br><br>
        <div id="searchResults">

        </div>
    </section>
   
    <section id="categories">
         <h1>CATEGORIES</h1><br><br>
         <div id="categoryCards">

         </div>
    </section>
    <script>
        async function getCategories(){
               let response = await fetch("https://www.themealdb.com/api/json/v1/1/categories.php")
               let data = await response.json()
               let category = data.categories.map((item)=>{
                     
                       return  ` <div id="card" onclick="showMeals('${item.strCategory}')">
                             <img src="${item.strCategoryThumb}" height="150px" width="150px">
                             <p id="item">${item.strCategory.toUpperCase()}</p>  
                             </div> `
              })
              
              document.getElementById("categoryCards").innerHTML = category.join("")      
        }
          
        getCategories()
        function showMeals(category){
                window.location.href = `meals.html?category=${encodeURIComponent(category)}`
              } 
    </script>
    <script src="../javascript/common.js"></script>
</body>
</html>
