<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<header>
    <h1>MEAL FINDER</h1>
    <i class="fa-solid fa-bars" id="menu"></i>
    
    <div id="categoryMenu">
       <i class="fa-regular fa-circle-xmark" id="close" style="color: orangered;"></i>
        <div id="categoryList"></div>
    </div>
</header>
    <section class="bgd-img">
        <img src="img.jpg" width="100%" height="450px" alt="">
        <div class="search">
            <input type="text" placeholder="search recipes" id="searchInput">
            <i class="fa-solid fa-magnifying-glass" id="searchBtn"></i><br><br>
            <h2>What are your favorite Cuisines?</h2><br>
            <p>PERSONALIZE YOUR EXPERIENCE</p>
        </div>
        
    </section>
    <section id="searchMeal">
        <h1>MEALS</h1><br><br>
        <div id="searchResults">

        </div>
    </section>
   
    <section id="description">

    </section>
    <section id="meal">
       <h1>MEALS</h1><br><br>
       <div id="mealCards">

       </div>
    </section>
    <script>
        async function getMeals(){
              let params = new URLSearchParams(window.location.search);
              let category = params.get("category");
              let response =  await fetch("https://www.themealdb.com/api/json/v1/1/categories.php")
              let data = await response.json()
              let categoryDetails = data.categories.find((item)=>{
                return item.strCategory === category
              })
              document.getElementById("description").innerHTML = `<h1 class="cateName">${categoryDetails.strCategory}</h1><br>
                                                              <p class="desc">${categoryDetails.strCategoryDescription}<p>`
              let response1 = await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?c=${encodeURIComponent(category)}`)
              let data1 = await response1.json()
              
              let mealCards = data1.meals.map((item)=>{
                return `<div class = "mealCard" onclick="mealDetails(${item.idMeal})">
                           <img src="${item.strMealThumb}" height="150px" width="200px">
                           <p>${item.strCountry}</p>
                           <h4>${item.strMeal}</h4>
                </div>`

              })
              document.getElementById("mealCards").innerHTML = mealCards.join("")
             
        }
        getMeals()
        function mealDetails(id){
                window.location.href = `mealDetails.html?id=${encodeURIComponent(id)}`
              }  
    </script>
    <script src="../javascript/common.js"></script>
</body>
</html>
